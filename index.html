<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PrevenIA — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#14213D;
    --navy-2:#1C2C4C;
    --bg:#F4F5F3;
    --panel:#FFFFFF;
    --ink:#14213D;
    --muted:#5B6472;
    --line:#E3E5E1;
    --gold:#C98A2B;
    --green:#2E8B57;
    --green-bg:#E9F5EE;
    --amber:#C98A2B;
    --amber-bg:#FBF1DE;
    --red:#B5423A;
    --red-bg:#FBEBE8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}

  .shell{
    display:grid;
    grid-template-columns: 340px 1fr;
    min-height:100vh;
  }
  @media (max-width: 860px){
    .shell{grid-template-columns: 1fr;}
    .sidebar{order:1;}
    .main{order:2;}
  }

  /* ---- Sidebar ---- */
  .sidebar{
    background:var(--navy);
    color:#EDEFF3;
    padding:28px 22px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand .name{font-size:22px; font-weight:700; letter-spacing:-0.01em;}
  .brand .tag{font-size:12.5px; color:#AEB6C8; line-height:1.4;}

  .section-select{
    font-size:12.5px;
    color:#AEB6C8;
    border-top:1px solid rgba(255,255,255,0.12);
    padding-top:14px;
  }
  .section-select strong{display:block; color:#fff; font-size:14px; font-weight:600; margin-top:2px;}

  .summary{
    display:flex;
    gap:8px;
  }
  .summary-pill{
    flex:1;
    border-radius:8px;
    padding:10px 8px;
    text-align:center;
    background:rgba(255,255,255,0.06);
  }
  .summary-pill .n{font-family:'IBM Plex Mono', monospace; font-size:19px; font-weight:600;}
  .summary-pill .l{font-size:10.5px; color:#AEB6C8; margin-top:2px; text-transform:uppercase; letter-spacing:.04em;}
  .summary-pill.red .n{color:#E38178;}
  .summary-pill.amber .n{color:#E3B45E;}
  .summary-pill.green .n{color:#7FCBA0;}

  .list{
    display:flex;
    flex-direction:column;
    gap:4px;
    overflow-y:auto;
    margin-top:4px;
  }
  .stu-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 10px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid transparent;
  }
  .stu-row:hover{background:rgba(255,255,255,0.06);}
  .stu-row.active{background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.18);}
  .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
  .dot.red{background:#E38178;}
  .dot.amber{background:#E3B45E;}
  .dot.green{background:#7FCBA0;}
  .stu-row .info{flex:1; min-width:0;}
  .stu-row .info .nm{font-size:13.5px; font-weight:500; color:#F3F4F7; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .stu-row .info .sub{font-size:11px; color:#9AA3B5;}
  .stu-row .score{font-family:'IBM Plex Mono', monospace; font-size:13px; color:#EDEFF3; opacity:.85;}

  /* ---- Main ---- */
  .main{padding:34px 42px; max-width:840px;}
  @media (max-width:860px){ .main{padding:22px 18px;} }

  .top-note{
    font-size:12.5px;
    color:var(--muted);
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
    margin-bottom:26px;
  }

  .detail-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    margin-bottom:22px;
  }
  .detail-head h1{
    font-size:26px;
    margin:0 0 4px 0;
    letter-spacing:-0.01em;
  }
  .detail-head .meta{font-size:13.5px; color:var(--muted);}
  .badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:600;
    padding:7px 14px;
    border-radius:999px;
    white-space:nowrap;
  }
  .badge.red{background:var(--red-bg); color:var(--red);}
  .badge.amber{background:var(--amber-bg); color:var(--amber);}
  .badge.green{background:var(--green-bg); color:var(--green);}

  .cards{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:12px;
    margin-bottom:26px;
  }
  @media (max-width:600px){ .cards{grid-template-columns:1fr 1fr;} }
  .stat{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
  }
  .stat .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
  .stat .v{font-family:'IBM Plex Mono', monospace; font-size:19px; font-weight:600;}
  .stat .v.small{font-family:'IBM Plex Sans'; font-size:15px; font-weight:600;}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px 22px;
    margin-bottom:20px;
  }
  .panel h2{font-size:14.5px; margin:0 0 14px 0; font-weight:600;}

  .factor-row{
    display:grid;
    grid-template-columns: 150px 1fr 60px;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
    font-size:13px;
  }
  .factor-row:last-child{margin-bottom:0;}
  .factor-row .flabel{color:var(--ink);}
  .factor-row .fdesc{font-size:11.5px; color:var(--muted); display:block; margin-top:1px;}
  .track{
    background:#EEF0EC;
    border-radius:5px;
    height:9px;
    overflow:hidden;
  }
  .fill{height:100%; border-radius:5px;}
  .fill.red{background:#C7776E;}
  .fill.amber{background:#D7A24E;}
  .fill.green{background:#4FA47B;}
  .factor-row .fval{font-family:'IBM Plex Mono', monospace; font-size:12.5px; text-align:right; color:var(--muted);}

  .tags{display:flex; gap:8px; flex-wrap:wrap;}
  .tag{
    font-size:12px;
    padding:5px 10px;
    border-radius:6px;
    background:#F1F2EE;
    color:var(--ink);
    border:1px solid var(--line);
  }

  .ai-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--navy);
    color:#fff;
    border:none;
    padding:11px 18px;
    border-radius:8px;
    font-family:'IBM Plex Sans';
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  .ai-btn:hover{background:var(--navy-2);}
  .ai-btn:disabled{opacity:.6; cursor:default;}

  .ai-result{
    margin-top:16px;
    background:#FBF8F1;
    border:1px solid #EADFC4;
    border-radius:8px;
    padding:16px 18px;
    font-size:14px;
    line-height:1.55;
    color:#3A3226;
    display:none;
  }
  .ai-result.show{display:block;}
  .ai-result .lbl{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:#9A8558;
    margin-bottom:8px;
    font-weight:600;
  }
  .ai-err{color:var(--red);}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15); border-radius:4px;}
</style>
</head>
<body>

<div class="shell">
  <div class="sidebar">
    <div class="brand">
      <div class="name">PrevenIA</div>
      <div class="tag">Alerta temprana de riesgo de abandono escolar</div>
    </div>

    <button id="backToCursos" style="align-self:flex-start; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#EDEFF3; padding:7px 12px; border-radius:7px; font-size:12px; cursor:pointer; font-family:'IBM Plex Sans'; margin-top:4px;">← Mis cursos</button>

    <div class="section-select">
      Tutoría a cargo
      <strong id="cursoActivo">Panel General</strong>
    </div>

    <div class="summary" id="summaryPills"></div>
    <div class="list" id="studentList"></div>
  </div>

  <div class="main">
    <div class="top-note">Datos obtenidos desde Supabase en tiempo real.</div>
    <div id="detail"></div>
  </div>
</div>

<script>
let students = [];

const gradeScoreMap = {baja:100, estable:40, sube:10};
const gradeLabelMap = {baja:"Bajando", estable:"Estable", sube:"Subiendo"};
const WEIGHTS = {attendance:0.40, grade:0.30, work:0.15, repeat:0.15};
const levelLabel = {red:"Riesgo alto", amber:"Riesgo medio", green:"Riesgo bajo"};

// Función para obtener estudiantes de la base de datos
async function cargarEstudiantes() {
  try {
    const response = await fetch("/api/estudiantes");
    const data = await response.json();
    
    // Mapeamos las columnas exactas de tu tabla Supabase
    students = data.map(d => ({
      name: d.nombre,
      attendance: d.asistencia_pct,
      grade: d.tendencia_notas,
      works: d.trabaja,
      repeated: d.repitio,
      section: d.seccion,
      week: d.semana 
    }));

    // Calculamos el riesgo internamente para pintar la interfaz
    students.forEach(s => { const r = computeRisk(s); s.risk = r; });
    students.sort((a,b) => b.risk.total - a.risk.total);

    // Renderizamos la interfaz
    renderSummary();
    renderList(0);
    if(students.length > 0) renderDetail(0);
    
  } catch (error) {
    console.error("Error al cargar datos de Supabase:", error);
  }
}

function computeRisk(s){
  const attendanceScore = Math.max(0, 100 - s.attendance);
  // Por si hay algún error en los datos de la DB, asignamos un valor por defecto
  const gradeScore = gradeScoreMap[s.grade] || 50; 
  const workScore = s.works ? 100 : 0;
  const repeatScore = s.repeated ? 100 : 0;

  const contrib = {
    attendance: attendanceScore * WEIGHTS.attendance,
    grade: gradeScore * WEIGHTS.grade,
    work: workScore * WEIGHTS.work,
    repeat: repeatScore * WEIGHTS.repeat,
  };
  const total = Math.round(contrib.attendance + contrib.grade + contrib.work + contrib.repeat);
  let level = "green";
  if (total >= 70) level = "red";
  else if (total >= 40) level = "amber";
  return {total, level, contrib, attendanceScore, gradeScore};
}

function renderSummary(){
  const counts = {red:0, amber:0, green:0};
  students.forEach(s => counts[s.risk.level]++);
  const el = document.getElementById('summaryPills');
  el.innerHTML = `
    <div class="summary-pill red"><div class="n mono">${counts.red}</div><div class="l">Alto</div></div>
    <div class="summary-pill amber"><div class="n mono">${counts.amber}</div><div class="l">Medio</div></div>
    <div class="summary-pill green"><div class="n mono">${counts.green}</div><div class="l">Bajo</div></div>
  `;
}

function renderList(activeIdx){
  const el = document.getElementById('studentList');
  el.innerHTML = students.map((s, i) => `
    <div class="stu-row ${i===activeIdx ? 'active':''}" data-idx="${i}">
      <div class="dot ${s.risk.level}"></div>
      <div class="info">
        <div class="nm">${s.name}</div>
        <div class="sub">${s.attendance}% asistencia &middot; ${gradeLabelMap[s.grade] || s.grade}</div>
      </div>
      <div class="score mono">${s.risk.total}</div>
    </div>
  `).join('');
  el.querySelectorAll('.stu-row').forEach(row => {
    row.addEventListener('click', () => {
      const idx = parseInt(row.getAttribute('data-idx'));
      
      // Removemos la clase active anterior y se la ponemos al nuevo
      el.querySelectorAll('.stu-row').forEach(r => r.classList.remove('active'));
      row.classList.add('active');
      
      renderDetail(idx);
    });
  });
}

function factorRow(label, desc, value, level){
  return `
    <div class="factor-row">
      <div>
        <div class="flabel">${label}</div>
        <span class="fdesc">${desc}</span>
      </div>
      <div class="track"><div class="fill ${level}" style="width:${Math.min(100, value)}%"></div></div>
      <div class="fval mono">${value.toFixed(0)} pts</div>
    </div>
  `;
}

function renderDetail(idx){
  if (!students[idx]) return;
  const s = students[idx];
  const r = s.risk;
  const tags = [];
  if (s.works) tags.push("Trabaja además de estudiar");
  if (s.repeated) tags.push("Repitió de año");
  if (!s.works && !s.repeated) tags.push("Sin factores de contexto adicionales");

  const detail = document.getElementById('detail');
  detail.innerHTML = `
    <div class="detail-head">
      <div>
        <h1>${s.name}</h1>
        <div class="meta">Sección: ${s.section || 'No especificada'} &middot; Semana: ${s.week || '-'} &middot; Puntaje: <strong class="mono">${r.total}/100</strong></div>
      </div>
      <div class="badge ${r.level}">${levelLabel[r.level]}</div>
    </div>

    <div class="cards">
      <div class="stat">
        <div class="l">Asistencia</div>
        <div class="v">${s.attendance}%</div>
      </div>
      <div class="stat">
        <div class="l">Tendencia de notas</div>
        <div class="v small">${gradeLabelMap[s.grade] || s.grade}</div>
      </div>
      <div class="stat">
        <div class="l">Contexto</div>
        <div class="v small">${s.works || s.repeated ? "Con factores" : "Sin factores"}</div>
      </div>
    </div>

    <div class="panel">
      <h2>Por qué tiene este puntaje</h2>
      ${factorRow("Asistencia", "40% del puntaje &middot; " + s.attendance + "% de clases atendidas", r.contrib.attendance, r.level)}
      ${factorRow("Notas", "30% del puntaje &middot; tendencia " + (gradeLabelMap[s.grade] || "").toLowerCase(), r.contrib.grade, r.level)}
      ${factorRow("Trabaja", "15% del puntaje", r.contrib.work, r.level)}
      ${factorRow("Repitencia", "15% del puntaje", r.contrib.repeat, r.level)}
    </div>

    <div class="panel">
      <h2>Factores de contexto</h2>
      <div class="tags">${tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    </div>

    <div class="panel">
      <h2>Recomendación para el tutor</h2>
      <button class="ai-btn" id="aiBtn">Generar recomendación con IA</button>
      <div class="ai-result" id="aiResult"></div>
    </div>
  `;

  document.getElementById('aiBtn').addEventListener('click', () => generateRecommendation(s, r));
}

async function generateRecommendation(s, r){
  const btn = document.getElementById('aiBtn');
  const box = document.getElementById('aiResult');
  btn.disabled = true;
  btn.textContent = "Generando...";
  box.classList.add('show');
  box.innerHTML = `<div class="lbl">Recomendación IA</div>Analizando el caso de ${s.name}...`;

  try {
    const response = await fetch("/api/recomendacion", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        nombre: s.name,
        asistencia: s.attendance,
        notas: s.grade,
        trabaja: s.works,
        repite: s.repeated,
        puntaje: r.total
      })
    });
    
    if (!response.ok) {
        throw new Error("Error en la respuesta del servidor");
    }
    
    const data = await response.json();
    box.innerHTML = `<div class="lbl">Recomendación IA</div>${data.recomendacion}`;
  } catch(err) {
    box.innerHTML = `<div class="lbl">Recomendación IA</div><span class="ai-err">Error al conectar con el servidor local. Revisa la consola para más detalles.</span>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "Generar recomendación con IA";
  }
}

// Guard de sesion: si no hay usuario logueado, volver al login
if (!localStorage.getItem('prevenia_user')) {
  window.location.href = '/';
}

// Leer el curso seleccionado desde la URL (viene de /cursos)
const urlParams = new URLSearchParams(window.location.search);
const nombreCurso = urlParams.get('nombre');
if (nombreCurso) {
  const cursoEl = document.getElementById('cursoActivo');
  if (cursoEl) cursoEl.textContent = decodeURIComponent(nombreCurso);
}
const backBtn = document.getElementById('backToCursos');
if (backBtn) backBtn.addEventListener('click', () => { window.location.href = '/cursos'; });

// Iniciar carga de datos al abrir la página
cargarEstudiantes();
</script>

</body>
</html>
